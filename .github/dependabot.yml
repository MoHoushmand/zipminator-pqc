version: 2
updates:
  # Rust workspace (crates/*)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
      cryptography:
        applies-to: version-updates
        patterns:
          - "sha3"
          - "subtle"
          - "rand*"
          - "getrandom"
          - "pyo3"
          - "aws-lc-*"
          - "rustls*"
          - "webpki*"
          - "quinn*"
      development:
        applies-to: version-updates
        patterns:
          - "criterion"
          - "proptest"

  # Tauri browser crate (separate workspace)
  - package-ecosystem: "cargo"
    directory: "/browser/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "rust"
      - "tauri"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python SDK
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      quantum:
        patterns:
          - "qiskit*"
          - "qbraid*"
      crypto:
        patterns:
          - "cryptography"
          - "pycryptodome"

  # FastAPI backend
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "python"
      - "api"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Next.js web dashboard
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "javascript"
      - "web"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "next-*"
          - "@next/*"
          - "react"
          - "react-*"
          - "@types/react*"

  # Expo mobile app
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "javascript"
      - "mobile"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "MoHoushmand"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
