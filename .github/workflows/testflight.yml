name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'crates/zipminator-app/**'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'TestFlight changelog note'
        required: false
        default: 'Internal build'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & upload to TestFlight
    if: ${{ vars.IOS_TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      ITC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      BUILD_NUMBER: ${{ github.run_number }}
      CHANGELOG: ${{ inputs.changelog || 'Internal build' }}
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer 2>/dev/null || \
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26* 2>/dev/null | head -1)/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app/ios

      - name: Write app/.env from secrets
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '# Generated by CI from GitHub Secrets\nSUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          test -s .env || (echo "::error::.env empty - SUPABASE_* secrets missing"; exit 1)

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Pod install
        working-directory: app/ios
        run: pod install --repo-update

      - name: Decode ASC API key for xcodebuild
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: printf '%s' "$ASC_API_KEY_CONTENT" | base64 -d > /tmp/AuthKey.p8

      - name: Fastlane verify (wiring check)
        working-directory: app/ios
        run: bundle exec fastlane verify

      - name: Fastlane beta (build + upload)
        working-directory: app/ios
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zipminator-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
