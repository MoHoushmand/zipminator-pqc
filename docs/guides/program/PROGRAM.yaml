# Zipminator Full-Program Beta Push — track manifest (single source of truth)
# Read/written by /goals; mirrored into ruflo memory for cross-session resume.
# Plan: ~/.claude/plans/compiled-tickling-snowglobe.md
# States: PLANNED | IN_PROGRESS | AWAITING_REVIEW | MERGED | ABORTED | HUMAN_GATED
program: zipminator-pqc-superapp
created: 2026-05-30
updated: 2026-05-30

gate_policy:
  required: [cargo_test, clippy, build, playwright_screenshot]
  crates_extra: [fmt_check, nist_kat, const_time, cargo_audit, cargo_deny, cargo_fuzz_keygen]
  web: [type_check, lint, vitest, build, playwright_prod]   # Playwright vs `next start`, never HMR
  flutter: [flutter_test, flutter_analyze]
  python: [pytest, ruff, version_reconcile]
  docs: [link_check, citation_resolve, claim_scan, features_sync]
port_locks:
  "3099": null   # only one track binds the web dev/preview server at a time

defaults:
  branch_prefix: "marathon/20260530"
  worktree_prefix: "../zipminator-"
  ralph_max_iter: 12
  merge: human-only            # via /goals approve
  auto_commit: branch-only     # never main

tracks:
  T0:
    name: "Merge train · version reconcile · repo hygiene"
    tier: opus
    worktree: ../zipminator-T0
    branch: marathon/20260530/setup
    state: IN_PROGRESS
    blocking: true             # gates D, E, I
    milestones:
      - id: version-reconcile
        success_criteria: ["pyproject.toml==0.5.1 matches __init__.py", "per-artifact scheme documented"]
        status: pending
      - id: branch-triage
        success_criteria: ["antigravity-ux-review/archive/old-structure classified", "merge order report"]
        status: pending
      - id: worktree-hygiene
        success_criteria: ["modified docs + stash + untracked skills assets dispositioned"]
        status: pending
    human_actions:
      - "Confirm version scheme on diff; perform merges to main; decide stash@{0} disposition"
    checkpoint_key: "program/T0/checkpoint"

  A:
    name: "Waitlist e2e + anonymous fallback"
    tier: sonnet ; security_review: opus
    worktree: ../zipminator-A ; branch: marathon/20260530/waitlist
    owns: ["web/app/api/waitlist", "web/lib/supabase.ts", "web/lib/email.ts", "web/supabase/"]
