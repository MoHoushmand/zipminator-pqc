# coturn TURN/STUN server config — Zipminator PQ-VoIP relay
#
# This server relays SRTP-encrypted media for the PQ-VoIP pillar. SRTP master
# keys are derived from ML-KEM-768 shared secrets at the application layer
# (PqSrtpService + crates/zipminator-core/src/srtp.rs); the TURN server
# carries opaque ciphertext only and never sees the keys or media payload.
#
# Reference docs:
# - https://github.com/coturn/coturn/wiki/CoturnConfig
# - RFC 5766 (TURN), RFC 5389 (STUN), RFC 6062 (TURN/TCP)

# ── Listeners ────────────────────────────────────────────────────────────
# Standard STUN/TURN listening port (UDP + TCP)
listening-port=3478
# TLS-protected TURN port (TURNS)
tls-listening-port=5349

# Listen on all interfaces by default; production should restrict via
# `listening-ip=<host>` or run behind a firewall.
# listening-ip=0.0.0.0

# Relayed-traffic IPv4 range allocation (must be reachable by clients).
# In Docker the relay-ip equals the container's published address; users
# override via env or a wrapper compose file.
# relay-ip=...

# Port range used for relayed transport addresses. Keep narrow to make
# firewall rules tractable. 49152..50000 → 849 ports, plenty for a single
# coturn instance handling thousands of simultaneous calls.
min-port=49152
max-port=50000

# ── Authentication ───────────────────────────────────────────────────────
# Long-term credential mechanism: clients negotiate via the application
# (zipminator-api) which issues short-lived TURN credentials backed by a
# shared static-auth-secret (REST API per
# https://datatracker.ietf.org/doc/html/draft-uberti-rtcweb-turn-rest-00).
lt-cred-mech
use-auth-secret

# The static auth secret is supplied at runtime via env (TURN_AUTH_SECRET)
# substituted into this file by the docker entrypoint, OR via a dropped
# config file at /etc/coturn/secret.conf.
# DO NOT commit a real secret here. The placeholder below is for templating.
static-auth-secret=__REPLACE_AT_DEPLOY__

# Authentication realm — must match the application's TURN credential issuer.
realm=turn.zipminator.zip

# Credential lifetime: 1h is the WebRTC standard sweet spot.
total-quota=1200
user-quota=12

# ── Hardening ────────────────────────────────────────────────────────────
# Disable multi-tenancy and admin features we do not need.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Disable RFC 5780 NAT-behavior discovery (we control the relay).
no-rfc5780
# Disable STUN backwards-compatibility (use TURN over RFC 5389+).
no-stun-backward-compatibility
# Drop loopback peers (prevent loops).
no-loopback-peers
# Block traffic to private/RFC-1918 ranges by default; production overrides.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Mobility (RFC 8016) — allow clients to roam between networks without
# tearing down the relay. Required for mobile hand-off.
mobility

# Fingerprint the binding requests (RFC 5389 §6).
fingerprint

# ── TLS ──────────────────────────────────────────────────────────────────
# Production TLS termination is handled by an external reverse proxy
# (envoy/nginx/cloudflared); this config keeps the cert paths optional so
# the server still boots without certs in development.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem
# Strong cipher suites only — drop legacy.
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!RC4:!3DES"
# Use a 2048-bit DH parameter file when present.
# dh-file=/etc/coturn/dhparam.pem

# ── Logging ──────────────────────────────────────────────────────────────
log-file=/var/log/coturn/turnserver.log
simple-log
no-stdout-log

# ── Process ──────────────────────────────────────────────────────────────
# coturn must NOT run as root in production.
proc-user=turnserver
proc-group=turnserver
